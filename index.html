<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prabesh Bhusal - Portfolio & Interactive Journey Tree</title>
    <meta name="description" content="Official interactive portfolio of Prabesh Bhusal, Software Developer and Network Administrator based in Bhairahawa, Nepal. Featuring 3D interactive journey tree, project showcase, and admin CMS." />
    <meta property="og:title" content="Prabesh Bhusal - Portfolio & Interactive Journey Tree" />
    <meta property="og:description" content="Official interactive portfolio of Prabesh Bhusal, Software Developer and Network Administrator based in Bhairahawa, Nepal. Featuring 3D interactive journey tree, project showcase, and admin CMS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('prabesh_portfolio_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
